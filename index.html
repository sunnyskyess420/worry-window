<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worry Toolbox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛤️</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:radial-gradient(900px 600px at 90% -10%,#ece9ff,rgba(236,233,255,0)),radial-gradient(700px 500px at -10% 100%,#e2f5f0,rgba(226,245,240,0)),#f7f6fb;
--ink:#312e46;--card:#fff;--card-brd:#eceaf4;--muted:#8a87a0;--faint:#9b98b0;--lesson-ink:#514d68;
--field:#fbfaff;--field-brd:#e4e2f0;--chip-bg:#fff;--chip-brd:#e4e2f0;--chip-ink:#5d5a75;
--soft-bg:#eef0ff;--soft-ink:#4338ca;
--quote-bg:#f7f6fb;--quote-brd:#a5b4fc;
--tip-bg:#fff7e6;--tip-brd:#f5e3c0;--tip-ink:#92400e;
--swap-bg:#ecfdf5;--swap-brd:#c6ecdc;--swap-ink:#065f46;
--why-bg:#eef0ff;--why-brd:#dbe0ff;--why-ink:#4338ca;
--well:#f7f6fb;--mission-brd:#d9d6ee;
--st-a-bg:#fff4e0;--st-a-brd:#f5e3c0;--st-a-ink:#b45309;
--st-p-bg:#eef0ff;--st-p-brd:#dbe0ff;--st-p-ink:#4338ca;
--st-r-bg:#e8f8f2;--st-r-brd:#c6ecdc;--st-r-ink:#047857;
--st-l-bg:#f7f6fb;--st-l-ink:#5d5a75;
--track:#e9e7f5;--tabs-bg:rgba(255,255,255,.92);--tabs-brd:#eceaf4;
--toast-bg:#312e46;--toast-ink:#fff;--err:#dc2626;
--cur-bg:linear-gradient(135deg,#f3f2ff,#fff 65%);--cur-brd:#c7d2fe;--skic:#f7f6fb;
}
body.dark{
--bg:radial-gradient(900px 600px at 90% -10%,#262143,rgba(38,33,67,0)),radial-gradient(700px 500px at -10% 100%,#14322c,rgba(20,50,44,0)),#17151f;
--ink:#e8e6f2;--card:#211e2e;--card-brd:#332f47;--muted:#9d99b5;--faint:#7f7b99;--lesson-ink:#c3c0d6;
--field:#1a1824;--field-brd:#3a3552;--chip-bg:#262238;--chip-brd:#3a3552;--chip-ink:#c0bcdc;
--soft-bg:#2c2849;--soft-ink:#c7d2fe;
--quote-bg:#1a1824;--quote-brd:#6366f1;
--tip-bg:#2b2312;--tip-brd:#4d3d1a;--tip-ink:#fbbf24;
--swap-bg:#0e2a1f;--swap-brd:#1e4d38;--swap-ink:#6ee7b7;
--why-bg:#252247;--why-brd:#3d3a6e;--why-ink:#c7d2fe;
--well:#1a1824;--mission-brd:#3a3552;
--st-a-bg:#33270f;--st-a-brd:#57431a;--st-a-ink:#fbbf24;
--st-p-bg:#2c2849;--st-p-brd:#3d3a6e;--st-p-ink:#a5b4fc;
--st-r-bg:#0e2a1f;--st-r-brd:#1e4d38;--st-r-ink:#34d399;
--st-l-bg:#262238;--st-l-ink:#c0bcdc;
--track:#332f47;--tabs-bg:rgba(23,21,31,.92);--tabs-brd:#332f47;
--toast-bg:#e8e6f2;--toast-ink:#312e46;--err:#f87171;
--cur-bg:linear-gradient(135deg,#2c2849,#211e2e 65%);--cur-brd:#4a4680;--skic:#1a1824;
color-scheme:dark;
}
body{margin:0 auto;max-width:560px;padding:16px 16px 120px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);transition:background .25s,color .25s}
.head{display:flex;gap:12px;align-items:center;padding:14px 2px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#818cf8,#14b8a6);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 20px rgba(99,102,241,.3)}
h1{font-size:21px;margin:0}h2{margin:4px 0}h3{margin:0 0 6px}
.sub{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--card-brd);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 24px rgba(62,55,130,.06)}
.skill{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--card-brd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 24px rgba(62,55,130,.06);cursor:pointer}
.skill:active{transform:scale(.985)}
.skill.cur{border-color:var(--cur-brd);background:var(--cur-bg);box-shadow:0 8px 28px rgba(79,70,229,.14)}
.skill.lock{opacity:.72}
.skic{width:44px;height:44px;border-radius:13px;background:var(--skic);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.skill b{display:block;font-size:15px}
.skill p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.skst{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;text-align:right}
.btn{border:none;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.primary{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.soft{background:var(--soft-bg);color:var(--soft-ink)}
.ghost{background:none;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea,input{width:100%;border:1.5px solid var(--field-brd);border-radius:12px;padding:12px;font:inherit;font-size:15px;background:var(--field);margin:6px 0;resize:vertical;color:var(--ink)}
input[type=time]{width:auto}
.chip{border:1px solid var(--chip-brd);background:var(--chip-bg);border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--chip-ink);font-family:inherit}
.chip.on{background:#4f46e5;border-color:#4f46e5;color:#fff}
.lbls,.filters,.dur{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.breath{width:180px;height:180px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 32% 28%,#a5b4fc,#6366f1 58%,#4f46e5);color:#fff;font-size:19px;font-weight:700;line-height:1.3;box-shadow:0 18px 46px rgba(99,102,241,.38);animation:b 5.5s ease-in-out infinite;font-family:inherit}
@keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.bc{width:150px;height:150px;border-radius:50%;margin:14px auto;background:radial-gradient(circle at 32% 28%,#a5b4fc,#6366f1 58%,#4f46e5);transition:transform 4s ease;box-shadow:0 14px 40px rgba(99,102,241,.35)}
.center{text-align:center;padding:18px 0}
.hint{color:var(--faint);font-size:13px;margin-top:14px}
.wcard{cursor:pointer}.wcard:active{transform:scale(.985)}
.wtxt{font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.chip.st{cursor:default}
.st.active{background:var(--st-a-bg);border-color:var(--st-a-brd);color:var(--st-a-ink)}
.st.parked{background:var(--st-p-bg);border-color:var(--st-p-brd);color:var(--st-p-ink)}
.st.resolved{background:var(--st-r-bg);border-color:var(--st-r-brd);color:var(--st-r-ink)}
.st.lb{background:var(--st-l-bg);color:var(--st-l-ink)}
.tm{margin-left:auto;color:var(--faint);font-size:11.5px}
.empty{text-align:center;color:var(--muted);font-size:14px}
.tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:var(--tabs-bg);backdrop-filter:blur(12px);border:1px solid var(--tabs-brd);border-radius:20px;padding:6px;box-shadow:0 14px 40px rgba(62,55,130,.18);z-index:40}
.tab{border:none;background:none;border-radius:14px;padding:8px 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;color:var(--muted);font-family:inherit}
.tab.on{background:#4f46e5;color:#fff}
.tab span{font-size:17px;position:relative}.tab b{font-size:10px;font-weight:700}
.bdg{position:absolute;top:-5px;right:-9px;background:#f59e0b;color:#fff;font-size:9px;font-style:normal;font-weight:700;border-radius:99px;padding:1px 5px}
.ov{position:fixed;inset:0;background:rgba(10,8,18,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 20px 30px;max-height:88vh;overflow:auto}
.handle{width:42px;height:5px;border-radius:99px;background:var(--field-brd);margin:6px auto 10px}
.eyebrow{text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:2px 0 8px}
.quote{background:var(--quote-bg);border-left:4px solid var(--quote-brd);border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.5;margin:6px 0 10px}
.fld{font-size:12.5px;color:var(--muted);margin:10px 0 0;font-weight:700}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);border-radius:13px;padding:11px 16px;font-size:13.5px;z-index:99;box-shadow:0 12px 30px rgba(35,32,52,.35);max-width:90vw}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#818cf8,#14b8a6);border-radius:99px;transition:width .3s}
.pbar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#818cf8,#14b8a6);border-radius:99px;transition:width .3s}
.timer{font-size:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat div{background:var(--well);border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}
.week{display:flex;gap:8px;align-items:flex-end;height:100px;margin-top:10px}
.week>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.week i{width:100%;max-width:34px;background:linear-gradient(180deg,#818cf8,#6366f1);border-radius:7px;min-height:3px}
.week b,.week em{font-size:10.5px;color:var(--muted);font-style:normal;font-weight:700}
ol.steps{padding-left:24px;line-height:1.55;font-size:14px}ol.steps li{margin:10px 0}
.tip{background:var(--tip-bg);border:1px solid var(--tip-brd);color:var(--tip-ink);border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin:10px 0}
.swap{background:var(--swap-bg);border:1px solid var(--swap-brd);color:var(--swap-ink);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.5}
.why{background:var(--why-bg);border:1px solid var(--why-brd);color:var(--why-ink);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.55}
.mission{background:var(--well);border:1.5px dashed var(--mission-brd);border-radius:14px;padding:12px 14px;margin:12px 0 4px}
.lesson p{line-height:1.6;font-size:14.5px;color:var(--lesson-ink);margin:8px 0}
.aerr{color:var(--err);font-size:13.5px;min-height:18px;margin:6px 0 2px;text-align:center}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:24px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ⬇️⬇️ PASTE YOUR SUPABASE KEYS HERE ⬇️⬇️
const SUPA_URL="https://aywkqtjcsvdqbrzlnypu.supabase.co";
const SUPA_KEY="sb_publishable_l9QQkm2SBIlGEpNWN2RZvg_BuuGPQys";
// ⬆️⬆️ PASTE YOUR SUPABASE KEYS HERE ⬆️⬆️

const sb=(SUPA_URL.startsWith('http')&&SUPA_KEY.length>20)?supabase.createClient(SUPA_URL,SUPA_KEY):null;
let USER=null,SYNC='local';

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const pick=a=>a[Math.floor(Math.random()*a.length)];

const LABELS=[
['whatif','🌀','What if…?'],
['cat','🔥','Worst-case'],
['mind','💭','Mind-reading'],
['always','♾️','All-or-nothing'],
['self','🏷️','Self-blame'],
['future','🔮','Fortune-telling']];
const SWAPS=[['🚶','a 5-minute walk'],['🫁','slow belly breaths'],['🎵','one favorite song, really listened to'],['💧','a glass of water, slowly'],['🧩','two minutes of a puzzle game'],['📞','text someone about anything else'],['🌱','water a plant'],['🤸','stretch for two minutes']];
const G5=[['👀','see',5],['✋','feel',4],['👂','hear',3],['👃','smell',2],['👄','taste',1]];
const BP=[['Breathe in…',4,1.18],['Hold…',4,1.18],['Breathe out slowly…',6,1]];
const REQ=[2,2,1,1,1,1,1];

let W;try{W=JSON.parse(localStorage.getItem('worrywindow')||'[]')}catch(e){W=[]}
let CFG={tab:'path',filter:'all',dur:15,time:'17:30',hi:false,theme:''};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('wwcfg')||'{}'))}catch(e){}
if(CFG.tab==='log')CFG.tab='worries';
if(CFG.tab==='tools'||CFG.tab==='guide')CFG.tab='path';
let USE={g5:0,br:0,trueNow:0,win:0,hb:0};
try{Object.assign(USE,JSON.parse(localStorage.getItem('wwuse')||'{}'))}catch(e){}
try{const old=JSON.parse(localStorage.getItem('wwcfg')||'{}').use;if(old){['g5','br','hb'].forEach(k=>{if(old[k]>USE[k])USE[k]=old[k]})}}catch(e){}
const saveLocal=()=>localStorage.setItem('worrywindow',JSON.stringify(W));
const saveCfg=()=>localStorage.setItem('wwcfg',JSON.stringify(CFG));
const saveUse=()=>{localStorage.setItem('wwuse',JSON.stringify(USE));pushSoon()};
let UI={capture:false,modal:null,challenge:null,welcome:!CFG.hi,auth:false,tricks:false,lesson:null,tool:null,gstep:0,kind:null};
let SES=null,TICK=null,BREATH=null;

// ---------- theme ----------
let THEME=CFG.theme||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
function applyTheme(){document.body.classList.toggle('dark',THEME==='dark')}
function toggleTheme(){THEME=THEME==='dark'?'light':'dark';CFG.theme=THEME;saveCfg();applyTheme();render()}
function themeChipHTML(){return `<button class="chip" style="font-size:14px" title="Light / dark" onclick="toggleTheme()">${THEME==='dark'?'☀️':'🌙'}</button>`}
function headExtras(){return `<div style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0">${syncChipHTML()}${themeChipHTML()}</div>`}

// ---------- cloud sync ----------
const save=()=>{saveLocal();pushSoon()};
let pushT=null;
function pushSoon(){if(!sb||!USER)return;SYNC='saving';updateChip();clearTimeout(pushT);pushT=setTimeout(pushNow,700)}
async function pushNow(){
  if(!sb||!USER)return;
  try{
    const{error}=await sb.from('ww_state').upsert({user_id:USER.id,payload:{v:2,w:W,p:USE},updated_at:new Date().toISOString()});
    if(error)throw error;
    SYNC='synced';updateChip();
  }catch(e){SYNC='offline';updateChip();toast("☁️ Couldn't sync just now — everything is safe on this device and will upload next time.")}
}
async function pullRemote(celebrate){
  if(!sb||!USER)return;
  try{
    const{data,error}=await sb.from('ww_state').select().eq('user_id',USER.id).maybeSingle();
    if(error)throw error;
    let rw=null,rp=null;
    if(data){
      if(Array.isArray(data.payload))rw=data.payload;
      else if(data.payload){rw=data.payload.w||[];rp=data.payload.p||{}}
    }
    if(rw&&rw.length){
      const map={};rw.forEach(w=>map[w.id]=w);
      W.forEach(w=>{if(!map[w.id])map[w.id]=w});
      W=Object.values(map).sort((a,b)=>b.created-a.created);
    }
    if(rp)['g5','br','trueNow','win','hb'].forEach(k=>{if((rp[k]||0)>USE[k])USE[k]=rp[k]});
    localStorage.setItem('wwuse',JSON.stringify(USE));
    SYNC='synced';saveLocal();UI.auth=false;render();pushNow();
    if(celebrate)toast('Signed in ✓ your path and worries now follow you everywhere ☁️');
  }catch(e){SYNC='offline';updateChip();toast('Signed in, but the cloud is unreachable — will retry. '+e.message)}
}
function chipTxt(){return !sb?'':!USER?'🔒 Sign in to sync':SYNC==='saving'?'☁️ saving…':SYNC==='offline'?'☁️ retry…':'☁️ synced'}
function updateChip(){const el=$('syncchip');if(el)el.textContent=chipTxt()}
function syncChipHTML(){return sb?`<button id="syncchip" class="chip" style="font-size:12px" onclick="UI.auth=true;render()">${chipTxt()}</button>`:''}
window.addEventListener('online',()=>{if(USER)pushSoon()});

function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}
function stBadge(w){return w.status==='parked'?'⏰ waiting':w.status==='resolved'?(w.resolution==='released'?'🎈 let go':w.resolution==='challenged'?'⚖️ talked back':w.resolution==='action'?'👣 acted on it':'✅ done'):'🫧 fresh'}

// ---------- progress metrics ----------
const mCaught=()=>W.length;
const mLabeled=()=>W.filter(w=>(w.labels||[]).length>0).length;
const mChecks=()=>W.filter(w=>w.ch).length;
const mGround=()=>USE.g5+USE.br+USE.trueNow;
const mSteps=()=>W.filter(w=>w.action&&w.action.done).length;
const mWin=()=>USE.win;
const mHabit=()=>USE.hb;
const METRICS=[mCaught,mLabeled,mChecks,mGround,mSteps,mWin,mHabit];
const doneFlag=n=>METRICS[n-1]()>=REQ[n-1];
const unlocked=n=>n===1||doneFlag(n-1);
const doneCount=()=>[1,2,3,4,5,6,7].filter(doneFlag).length;

function render(){
  const openC=W.filter(w=>w.status!=='resolved').length;
  let h='';
  if(CFG.tab==='path')h=UI.tool==='ground'?viewGround():UI.tool==='habit'?viewHabit():UI.lesson?lessonHTML(UI.lesson):viewPath();
  else if(CFG.tab==='worries')h=viewWorries();
  else if(CFG.tab==='window')h=viewWindow();
  else if(CFG.tab==='progress')h=viewStats();
  else h=viewPath();
  h+='<nav class="tabs">'+[['path','🛤️','Path'],['worries','🫧','Worries'],['progress','🌤️','Progress']].map(t=>
    `<button class="tab ${CFG.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[2]}${t[0]==='worries'&&openC?`<i class="bdg">${openC}</i>`:''}</span><b>${t[1]}</b></button>`).join('')+'</nav>';
  if(UI.welcome)h+=sheetWelcome();
  if(UI.auth)h+=sheetAuth();
  if(UI.tricks)h+=sheetTricks();
  if(UI.modal)h+=sheetWorry();
  if(UI.challenge)h+=sheetChallenge();
  $('app').innerHTML=h;
}
function go(t){UI.tool=null;UI.lesson=null;stopBreathSilent();CFG.tab=t;saveCfg();render()}
function openSkill(n){CFG.tab='path';UI.tool=null;stopBreathSilent();UI.lesson=n;saveCfg();render()}
function closeLesson(){UI.lesson=null;UI.tool=null;stopBreathSilent();render()}
function startCatch(){CFG.tab='worries';UI.capture=true;UI.lesson=null;UI.tool=null;saveCfg();render()}
function toOpenWorries(msg){CFG.tab='worries';CFG.filter='open';UI.lesson=null;UI.tool=null;saveCfg();toast(msg);render()}

const SKMETA=[
['🌀','Catch the worry loop','Notice the spin and write it down.'],
['🏷️','Name the thought, not yourself','“I’m having an anxious thought” — not “I am anxious.”'],
['⚖️','Check the facts','Put the worry on trial with three questions.'],
['🌸','“What if” → “What is”','Ground yourself back in right now.'],
['📝','One small step','Real problem? Do five minutes of it today.'],
['⏰','The Worry Window','Give worry a schedule — later, on purpose.'],
['💗','Swap in a helpful habit','Redirect the loop to something grounding.']];

function viewPath(){
  const cur=[1,2,3,4,5,6,7].find(n=>unlocked(n)&&!doneFlag(n));
  const done=doneCount();
  let h=`<div class="head"><div class="logo">🛤️</div><div><h1>My Path</h1><div class="sub">learn one skill at a time — no rush</div></div>${headExtras()}</div>`;

  <p class="hint" style="margin-top:6px">${done===7?'Use any tool, anytime, in any order. Reps are what rewire.':'Each skill unlocks a little practice mission. Finish it and the next skill opens. You can peek ahead anytime — nothing is hidden from you.'}</p></div>`;
  [1,2,3,4,5,6,7].forEach(n=>{
    const d=doneFlag(n),u=unlocked(n);
    const cls=d?'skill':u?(n===cur?'skill cur':'skill'):'skill lock';
    const st=d?'✅':u?(n===cur?'up next':'open'):'🔒';
    h+=`<div class="${cls}" onclick="openSkill(${n})"><div class="skic">${SKMETA[n-1][0]}</div><div style="flex:1"><b>${n}. ${SKMETA[n-1][1]}</b><p>${u?SKMETA[n-1][2]:'Unlocks when you finish Skill '+(n-1)+'’s practice — or tap to peek.'}</p></div><div class="skst">${st}</div></div>`;
  });
  h+=`<div class="card" style="opacity:.85"><b>⏰ About the Worry Window</b><p style="color:var(--muted);font-size:13px;margin:4px 0 8px">That’s Skill 6, near the end — on purpose. Your therapist wants this one light, so the app treats it that way. If worries are stacking up right now, the move is catching them (Skill 1), not scheduling them.</p><button class="btn ghost" onclick="CFG.tab='window';saveCfg();render()">peek at it anyway</button></div>`;
  return h;
}

  if(n===1)btn=`<button class="btn primary" style="width:100%;margin-top:8px" onclick="startCatch()">🫧 Catch a worry</button>`;
  if(n===2)btn=`<div class="row"><button class="btn primary" style="flex:1" onclick="toOpenWorries('Open a worry, then tap one of the 🏷️ trick labels')">Open my worries</button><button class="btn soft" onclick="UI.tricks=true;render()">See the 6 tricks</button></div>`;
  if(n===3)btn=`<button class="btn primary" style="width:100%;margin-top:8px" onclick="toOpenWorries('Open a worry, then tap ⚖️ Check the facts')">Pick a worry to fact-check</button>`;
  if(n===4)btn=`<div class="row"><button class="btn soft" style="flex:1" onclick="UI.gstep=0;UI.tool='ground';render()">👀 Senses game</button></div><div class="row"><button class="btn soft" style="flex:1" onclick="startBreath()">🫁 Belly breathing</button></div><div class="row"><button class="btn soft" style="flex:1" onclick="UI.gstep='true';UI.tool='ground';render()">🌤️ Name what is true</button></div>`;
  if(n===5)btn=`<button class="btn primary" style="width:100%;margin-top:8px" onclick="toOpenWorries('Open a worry, add your 👣 small step, then come back and tap “I did it”')">Open my worries</button>`;
  if(n===6)btn=`<button class="btn primary" style="width:100%;margin-top:8px" onclick="CFG.tab='window';UI.lesson=null;saveCfg();render()">Open the Worry Window</button>`;
  if(n===7)btn=`<button class="btn primary" style="width:100%;margin-top:8px" onclick="UI.tool='habit';render()">Pick a swap habit</button>`;
  return `<div class="mission">${prog}<p class="hint" style="margin:4px 0 0">${v>=r?'Done ✓ — the next skill is unlocked. Reps still count, so keep using it!':'Small reps count. Do it once and the path moves forward.'}</p>${btn}</div>`;
}

function lessonHTML(n){
  const u=unlocked(n);
  const L={
  1:{w:`Worry feels automatic — one minute you're doing dishes, the next your mind is playing tomorrow's meeting going badly, on repeat. <b>Skill 1 is simply noticing that moment.</b> You don't have to fix anything or feel better yet. You just catch the loop and write it down in a sentence or two.<br><br>Then ask the handout's question: <i>“Is this a real problem, or a fear-based thought?”</i> Real problems get action later (Skill 5). Fear-based thoughts get named and scheduled (later skills). Either way — out of your head, onto the page.`,
     y:`You can't change a loop you don't notice. Catching it creates a pause — and inside that pause, every other skill becomes possible. Writing it down also moves the worry out of your head (where it spins) onto the page (where it sits still). That alone takes the edge off.`,
     ex:`🫧 Example: Making coffee, I notice I've replayed tomorrow's meeting going badly five times. That's the loop. I open the app, type “What if I embarrass myself tomorrow?” and get back to my coffee. Thirty seconds. Done.`},
  2:{w:`Instead of saying <b>“I am anxious,”</b> you say <b>“I'm having an anxious thought.”</b> One small word change — huge difference. Even better: give the thought the name of its trick. Is it a 🌀 What-if spiral? A 🔥 worst-case movie? 🔮 Fortune-telling? There are six common tricks, and your brain has favorites.`,
     y:`Labeling creates distance. You are the sky; the thought is weather passing through. When you name the trick, you're reminded: <i>this is a brain habit, not the truth about my life.</i> That lowers the emotional intensity and makes the thought feel temporary — because it is.`,
     ex:`🏷️ Example: “This will be a disaster” feels like a prophecy. “I'm having a fortune-telling thought” feels like something you're <i>watching</i>. Same brain, same moment — completely different grip.`},
  3:{w:`Now that you can catch and name a worry, you question it — like a detective, not a prosecutor. The handout gives three questions:<br>1. <b>What proof do I have this will actually happen?</b><br>2. <b>Have I faced something similar before? What happened?</b><br>3. <b>What's a more balanced way to see this?</b><br><br>Short, honest answers are perfect. “Honestly? No proof yet” is a great answer.`,
     y:`Worry argues with feelings. Facts argue back. A vague dread floating in your head feels enormous; the moment it becomes specific claims on a page, it can be checked — and worries usually lose power when examined logically. Not always immediately. Often.`,
     ex:`⚖️ Example: “I'll bomb the presentation.” Proof? None — I've prepared twice. Faced similar? Yes, last month's went fine. Balanced version: “I'll be nervous, and I've done this before. Nervous isn't unprepared.”`},
  4:{w:`Worry lives in the future. Calm lives in the present. This skill pulls you back to <b>right now</b> with three tools:<br><br>👀 <b>The 5-4-3-2-1 senses game</b> — name 5 things you see, 4 you feel, 3 you hear, 2 you smell, 1 you taste.<br>🫁 <b>Deep belly breathing</b> — the app guides you; your belly rises on the in-breath.<br>🌤️ <b>Name what is true right now</b> — answer “what if…” with what <i>is</i>.`,
     y:`Your brain can't fully worry about the future while it's busy registering the present. That's not a trick — it's how attention works. Every grounding rep literally retrains your brain to stay anchored in reality. That's the “rewire” your handout talks about.`,
     ex:`🌸 Example: Heart racing over a text you keep re-reading. You start the senses game — 5 things you can see… by “2 things you can smell,” your shoulders have dropped. You're back in the room.`},
  5:{w:`If the worry is about a <b>real problem</b>, more analyzing won't help — action will. Ask the handout's question: <i>“What is one small thing I can do today?”</i> Key word: <b>small</b>. Five minutes max. Add the step to the worry in the app, go do it, then tap <b>“I did it!”</b>`,
     y:`Anxiety takes away your sense of control; action hands it back. A tiny step beats a perfect plan because it tells your brain: <i>we're not stuck — we're moving.</i> Real problems shrink when acted on; they grow when rehearsed.`,
     ex:`📝 Example: “Taxes are going to be a nightmare.” Step: “Put the folder on my desk.” That's it — that counts. Momentum does the rest tomorrow.`},
  6:{w:`Now the skill your therapist wants kept <b>light</b> — and that's exactly how we'll treat it. The idea: worries parked during the day get <b>one scheduled meeting</b> (10–15 minutes), then the window closes. Your brain learns worry has a schedule — not the whole day.<br><br>Many people find that once Skills 1–5 are strong, they barely need this. That's a success, not a failure. Use it as a tool when it helps; skip it when it doesn't.`,
     y:`Trying to force worries away backfires — the brain replays what you suppress. Scheduling works the opposite way: the worry is honored with an appointment, so your mind can release its grip until then. “See you at 5:30” is genuinely calming to a looping brain.`,
     ex:`⏰ Example: A worry shows up at 9 a.m. You write it down (Skill 1), maybe label it (Skill 2), and say “you get 5:30.” At 5:30 you meet it — by then, it's usually smaller.`},
  7:{w:`You can't just switch worry off — you <b>replace</b> it. When you catch the loop pulling you back in, gently redirect to something grounding: a walk, stretching, music, water, a puzzle, texting a friend about anything else. The app keeps a menu of swaps, including a 🎲 surprise button for when you're too tired to choose.`,
     y:`Mental habits don't get deleted — they get swapped. Every redirect is one repetition that weakens the old loop and strengthens the new path. It gets easier every time. That's not willpower or talent — that's just how brains rewire.`,
     ex:`💗 Example: You catch the spiral at the kitchen sink. You dry your hands, drink a glass of water slowly, then stretch for two minutes. Loop interrupted. Rep counted. Brain rewired — one tiny rep at a time.`}};
  const s=SKMETA[n-1];
  return `<div class="card">
  <div class="row" style="margin:0 0 4px"><button class="btn ghost" onclick="closeLesson()">← my path</button><div style="flex:1"></div>${themeChipHTML()}</div>
  <div class="eyebrow">skill ${n} of 7 ${u?'':(doneFlag(n)?'· ✅ practiced':'· 🔒 preview')}</div>
  <h2>${s[0]} ${s[1]}</h2>
  ${u?'':'<div class="tip">🔓 This unlocks naturally once you finish Skill '+(n-1)+'’s practice — but feel free to read ahead. Knowing what’s coming is half the battle.</div>'}
  <p><b>What it is.</b> ${L[n].w}</p>
  <div class="why"><b>🧠 Why it works.</b><br>${L[n].y}</div>
  <div class="quote">${L[n].ex}</div>
  ${missionBox(n)}
  ${n===2?'<div class="row"><button class="btn soft" style="flex:1" onclick="UI.tricks=true;render()">🏷️ Browse the 6 worry tricks</button></div>':''}
  </div>`;
}

function sheetTricks(){
  const EX={whatif:'“What if I mess up tomorrow?” — a question on repeat, with no answer to find.',cat:'“I will definitely get fired and lose everything.” — playing the worst-case movie.',mind:'“They all think I sounded stupid.” — guessing what others think, without proof.',always:'“I always fail.” “Nothing ever works out.” — all-or-nothing words.',self:'“I am such a disaster.” — labeling yourself instead of the thought.',future:'“This meeting will be a catastrophe.” — predicting the future like it is fact.'};
  return `<div class="ov" onclick="if(event.target===this){UI.tricks=false;render()}"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">🏷️ the six worry tricks</div>
  <p class="hint" style="text-align:center;margin-top:0">Say “I'm having a <i>what-if</i> thought” — naming the trick puts distance between you and the loop.</p>
  `+LABELS.map(l=>`<div class="quote" style="margin:8px 0"><b>${l[1]} ${l[2]}</b><br><span style="font-size:13.5px;color:var(--lesson-ink)">${EX[l[0]]}</span></div>`).join('')+`
  <div class="row"><button class="btn primary" style="flex:1" onclick="UI.tricks=false;render()">Got it ✓</button></div></div></div>`;
}

  <div class="row"><button class="btn soft" style="flex:1" onclick="UI.gstep=1;render()">👀 5-4-3-2-1 senses game</button></div>

function gNext(){if(UI.gstep>=5){USE.g5++;saveUse();UI.gstep='done'}else UI.gstep++;render()}
function trueNow(){USE.trueNow++;saveUse();UI.gstep='done';render()}
function startBreath(){UI.gstep=0;BREATH={ph:0,left:BP[0][1]};render();setTimeout(()=>{const c=$('bc');if(c){c.style.transition='transform 4s ease';c.style.transform='scale(1.18)'}},60);BREATH.tk=setInterval(()=>{
  if(!BREATH)return;
  BREATH.left--;
  if(BREATH.left<=0){BREATH.ph=(BREATH.ph+1)%3;BREATH.left=BP[BREATH.ph][1];const c=$('bc');if(c){c.style.transition='transform '+BP[BREATH.ph][1]+'s ease';c.style.transform='scale('+BP[BREATH.ph][2]+')'}}
  const n=$('bnum');if(n)n.textContent=BREATH.left;
  const t=$('btxt');if(t)t.textContent=BP[BREATH.ph][0];
},1000)}
function viewBreath(){return `<div class="card"><div class="row" style="margin:0"><button class="btn ghost" onclick="stopBreathSilent();UI.tool=null;UI.gstep=0;render()">← back</button><div style="flex:1"></div>${themeChipHTML()}</div><div class="eyebrow">🫁 deep belly breathing</div>
<div class="bc" id="bc" style="transform:scale(1)"></div>
<p class="center" style="font-size:17px;font-weight:700;margin:4px 0" id="btxt">${BP[0][0]}</p>
<p class="center" style="color:var(--muted)">follow the circle · <b id="bnum">${BREATH.left}</b></p>
<p class="hint" style="text-align:center">Hand on your belly — let it rise as you breathe in. A few rounds is plenty.</p>
<div class="row"><button class="btn primary" style="flex:1" onclick="stopBreath()">I feel calmer — done ✓</button></div></div>`}
function stopBreathSilent(){if(BREATH)clearInterval(BREATH.tk);BREATH=null}
function stopBreath(){stopBreathSilent();USE.br++;saveUse();UI.tool=null;toast("🌸 Nice. That's a rep — your brain just practiced calm.");render()}

// ---------- worries ----------
function viewWorries(){
  let h=`<div class="head"><div class="logo">🫧</div><div><h1>My Worries</h1><div class="sub">written down is already halfway handled</div></div>${headExtras()}</div>`;
  if(!W.length)h+=`<div class="tip"><b>How this works:</b><br>1️⃣ When a worry won't stop spinning, tap the big button and write it down.<br>2️⃣ Answer the quick check: real problem, or fear-based thought?<br>3️⃣ The path on the 🛤️ tab will tell you what to do with it next.</div>`;
  if(UI.capture){
    h+=`<div class="card"><textarea id="wtext" rows="3" autofocus placeholder="What's the worry? Your own words are perfect. e.g., What if I embarrass myself tomorrow?"></textarea>
    <div class="hint">Nobody sees this but you. Messy is fine — this is just for getting it out of your head.</div>
    <div class="fld">Quick check — real problem, or fear-based thought?</div>
    <div class="lbls"><button class="chip ${UI.kind==='fear'?'on':''}" onclick="setKind(this,'fear')">💭 Fear-based thought</button><button class="chip ${UI.kind==='real'?'on':''}" onclick="setKind(this,'real')">✅ Real problem</button></div>
    <div class="hint">Real problems get a small step. Fear-based ones get named and, later, scheduled. Not sure? Skip it.</div>
    <div class="fld">🏷️ Name the trick (optional — Skill 2 will teach these)</div>
    <div class="lbls">`+LABELS.map(l=>`<button class="chip" data-l="${l[0]}" onclick="this.classList.toggle('on')">${l[1]} ${l[2]}</button>`).join('')+`</div>
    <div class="row"><button class="btn primary" onclick="saveWorry()">🫧 Catch it</button><button class="btn ghost" onclick="UI.capture=false;UI.kind=null;render()">cancel</button></div></div>`;
  }else{
    h+=`<div class="center"><button class="breath" onclick="UI.capture=true;UI.kind=null;render()">Catch a<br>worry</button><div class="hint">tap the moment a worry starts going round and round — don't fix it, just write it down</div></div>`;
  }
  const f=CFG.filter;
  const cnt=s=>s==='all'?W.length:s==='open'?W.filter(w=>w.status!=='resolved').length:W.filter(w=>w.status===s).length;
  h+='<div class="filters">'+[['all','All'],['open','Still open'],['parked','⏰ Waiting'],['resolved','✅ Done']].map(x=>
    `<button class="chip ${f===x[0]?'on':''}" onclick="CFG.filter='${x[0]}';saveCfg();render()">${x[1]}${cnt(x[0])?' '+cnt(x[0]):''}</button>`).join('')+'</div>';
  const list=W.filter(w=>f==='all'||(f==='open'?w.status!=='resolved':w.status===f));
  if(!list.length)h+=`<div class="card empty">${W.length?'Nothing in this pile right now ✓':'Nothing here yet — that big button above is the whole practice.'}</div>`;
  list.forEach(w=>{
    const step=(w.action&&w.action.text&&!w.action.done&&w.status!=='resolved')?'<span class="chip st lb">📝 step waiting</span>':'';
    h+=`<div class="card wcard" onclick="UI.modal='${w.id}';render()"><div class="wtxt">${esc(w.text)}</div><div class="wmeta"><span class="chip st ${w.status}">${stBadge(w)}</span>${step}${(w.labels||[]).slice(0,3).map(l=>{const L=LABELS.find(x=>x[0]===l);return L?`<span class="chip st lb">${L[1]} ${L[2]}</span>`:''}).join('')}<span class="tm">${ago(w.created)}</span></div></div>`;
  });
  return h;
}
function setKind(el,k){UI.kind=k;[...el.parentNode.children].forEach(c=>c.classList.remove('on'));el.classList.add('on')}
function saveWorry(){
  const t=$('wtext')?$('wtext').value.trim():'';
  if(!t){toast('Type even one line first — it helps, promise');return}
  const labels=[...document.querySelectorAll('.lbls .chip.on')].map(c=>c.dataset.l).filter(Boolean);
  const kind=UI.kind;UI.kind=null;
  const id=uid();
  W.unshift({id,text:t,labels,status:'active',resolution:null,kind,created:Date.now()});
  save();UI.capture=false;
  if(kind==='real'){UI.modal=id;render();toast('Real problem? Add your one small step 👣');return}
  render();toast('Out of your head and onto the page ✓ That alone helps.');
}

function sheetWorry(){
  const w=W.find(x=>x.id===UI.modal);if(!w)return'';
  const labels=w.labels||[];
  return `<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">a thought, not a fact</div>
  <div class="quote">${esc(w.text)}</div>
  ${w.kind==='real'?'<div class="swap" style="margin:0 0 4px">✅ You marked this a <b>real problem</b> — so it gets action, not just worry.</div>':''}
  <div class="fld">🏷️ Name the trick (optional)</div>
  <div class="lbls">`+LABELS.map(l=>`<button class="chip ${labels.includes(l[0])?'on':''}" onclick="tglLbl('${w.id}','${l[0]}')">${l[1]} ${l[2]}</button>`).join('')+`</div>
  <div class="row"><button class="btn primary" onclick="UI.challenge='${w.id}';UI.modal=null;render()">⚖️ Check the facts</button><button class="btn soft" onclick="park('${w.id}')">${w.status==='parked'?'↩️ Not waiting anymore':'⏰ Save for Worry Time'}</button></div>
  <div class="fld">📝 One small step for today (5 minutes max)</div>
  <div class="row" style="flex-wrap:nowrap"><input id="actin" style="margin:0" value="${esc(w.action?w.action.text:'')}" placeholder="e.g., send one email · ask one question"><button class="btn soft" onclick="saveAct('${w.id}')">save</button></div>
  ${w.action&&w.action.text?`<div class="row"><span class="chip ${w.action.done?'st resolved':'st lb'}">${w.action.done?'✅ step done':'📝 step waiting'}</span>${!w.action.done&&w.status!=='resolved'?`<button class="btn green" onclick="doneAct('${w.id}')">✅ I did it!</button>`:''}</div>`:''}
  ${w.ch?`<div class="swap"><b>🌤️ What I figured out:</b> ${esc(w.ch.is||'—')}</div>`:''}
  ${w.status!=='resolved'?`<div class="row"><button class="btn ghost" onclick="resolve('${w.id}','manual')">✅ I feel okay about this one now</button></div>`:''}
  <div class="row" style="justify-content:center"><button class="btn ghost" onclick="del('${w.id}')">🗑️ delete this worry</button></div>
  </div></div>`;
}
function tglLbl(id,l){const w=W.find(x=>x.id===id);if(!w)return;w.labels=w.labels||[];w.labels=w.labels.includes(l)?w.labels.filter(x=>x!==l):[...w.labels,l];save();render()}
function park(id){const w=W.find(x=>x.id===id);if(!w)return;w.status=w.status==='parked'?'active':'parked';save();render()}
function resolve(id,r){const w=W.find(x=>x.id===id);if(!w)return;w.status='resolved';w.resolution=r;save();render();toast('Marked done ✓ Nice work.')}
function del(id){W=W.filter(x=>x.id!==id);save();closeSheet()}
function closeSheet(){UI.modal=null;UI.challenge=null;render()}
function saveAct(id){const w=W.find(x=>x.id===id);if(!w)return;const v=$('actin')?$('actin').value.trim():'';if(!v){toast('Type the small step first — even tiny counts');return}w.action={text:v,done:w.action?w.action.done:false};save();render();toast('Step saved 👣 Five minutes, then stop.')}
function doneAct(id){const w=W.find(x=>x.id===id);if(!w)return;w.action.done=true;w.status='resolved';w.resolution='action';save();render();toast('✅ You did the thing. Worries shrink with action.')}

function sheetChallenge(){
  const w=W.find(x=>x.id===UI.challenge);if(!w)return'';
  const c=w.ch||{for:'',against:'',is:''};
  return `<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">⚖️ check the facts</div>
  <div class="quote">${esc(w.text)}</div>
  <div class="tip">Worries hate specific questions. Answer like a detective — short and factual is perfect.</div>
  <div class="fld">🧐 What proof do I have that this will actually happen?</div><textarea id="cf" rows="2" placeholder="e.g., Honestly? None yet — it's just a feeling">${esc(c.for)}</textarea>
  <div class="fld">🤔 Have I faced something similar before? What happened?</div><textarea id="ca" rows="2" placeholder="e.g., Yes — last time it went fine, I was just nervous">${esc(c.against)}</textarea>
  <div class="fld">🌈 What's a more balanced way to see this?</div><textarea id="ci" rows="2" placeholder="e.g., It might be awkward, and I can handle awkward">${esc(c.is)}</textarea>
  <div class="row"><button class="btn primary" onclick="saveCh('${w.id}')">Save what I figured out ✓</button><button class="btn ghost" onclick="closeSheet()">close</button></div>
  </div></div>`;
}
function saveCh(id){
  const w=W.find(x=>x.id===id);if(!w)return;
  w.ch={for:$('cf').value.trim(),against:$('ca').value.trim(),is:$('ci').value.trim()};
  w.status='resolved';w.resolution='challenged';save();
  UI.challenge=null;UI.modal=null;
  render();toast('Saved ✓ That worry just got smaller.');
}

// ---------- skill 6: window (kept light) ----------
function viewWindow(){
  const parked=W.filter(w=>w.status==='parked');
  const top=`<div class="row" style="margin:0"><button class="btn ghost" onclick="CFG.tab='path';saveCfg();render()">← my path</button><div style="flex:1"></div>${themeChipHTML()}</div><p class="hint" style="text-align:center;margin:4px 0 0">Skill 6 — no pressure, this tool is here whenever you want it.</p>`;
  if(SES&&SES.done){
    const d=SES.done;
    return `<div class="card">${top}<div style="text-align:center;font-size:44px">🌙</div><h2 style="text-align:center;margin:4px 0">Worry Time is over</h2>
    <p class="center" style="color:var(--lesson-ink)">${d.reason==='time'?"Time's up — and that's the whole point. The window closed, and the worries stay in it.":d.reason==='done'?'You met every single worry on the list. That is a genuinely good day.':'You closed it early — totally allowed. You are the one in charge here.'}</p>
    <div class="stat"><div><b>${d.rel}</b><span>🎈 let go</span></div><div><b>${d.work}</b><span>⚖️ talked back</span></div><div><b>${d.keep}</b><span>⏳ next time</span></div></div>
    <div class="swap"><b>Still feel the pull to keep worrying? Do this instead:</b><br>${d.swap[0]} ${d.swap[1]}</div>
    <button class="btn primary" style="width:100%" onclick="SES=null;render()">Done</button></div>`;
  }
  if(SES&&SES.running){
    const w=SES.queue[SES.idx];
    return `<div class="card">${top}<div class="timer" id="tleft">${mmss(Math.max(0,Math.round((SES.endsAt-Date.now())/1e3)))}</div>
    <div class="bar"><i id="tbar" style="width:100%"></i></div>
    <p class="center" style="color:var(--muted);font-size:13px">Worry ${SES.idx+1} of ${SES.queue.length} · one at a time, that's all</p>
    ${w?`<div class="quote">${esc(w.text)}</div>
    <div class="row"><button class="btn green" onclick="release('${w.id}')">🎈 It feels lighter — let it go</button><button class="btn primary" onclick="UI.challenge='${w.id}';render()">⚖️ Check the facts</button></div>
    <div class="row"><button class="btn ghost" onclick="keep()">⏭ Not today — keep it for next time</button></div>`:''}
    <div class="row" style="justify-content:center"><button class="btn ghost" onclick="finish('early')">close Worry Time early</button></div></div>`;
  }
  return `<div class="card">${top}<h2>The Worry Window ⏰</h2>
  <p class="lesson">Worries parked during the day get one scheduled meeting here — then the window closes. Your brain learns that worry has a schedule, not the whole day.</p>
  <div class="fld">⏰ What time should your Worry Time be?</div><input type="time" value="${CFG.time}" onchange="CFG.time=this.value;saveCfg()">
  <div class="fld">⏳ How long should it last?</div><div class="dur">${[5,10,15,20,30].map(d=>`<button class="chip ${CFG.dur===d?'on':''}" onclick="CFG.dur=${d};saveCfg();render()">${d}m</button>`).join('')}</div>
  <div class="tip">💡 Tip: set a daily phone alarm for this time until the habit sticks.</div>
  <button class="btn primary" style="width:100%" onclick="startWin()">${parked.length?'Open my Worry Time · '+parked.length+' waiting':'Open my Worry Time'}</button>
  ${parked.length?'':'<p class="center" style="color:var(--muted);font-size:13px;margin-top:10px">Nothing waiting. Worries you “Save for Worry Time” will gather here.</p>'}</div>`;
}
function startWin(){
  const parked=W.filter(w=>w.status==='parked');
  if(!parked.length){toast("Nothing waiting yet — save worries during the day and they'll be here.");return}
  USE.win++;saveUse();
  SES={queue:parked.slice(),idx:0,total:CFG.dur*60,endsAt:Date.now()+CFG.dur*60000,stats:{rel:0,work:0,keep:0},running:true,done:null};
  render();startTick();
}
function startTick(){
  clearInterval(TICK);
  TICK=setInterval(()=>{
    if(!SES||!SES.running)return clearInterval(TICK);
    const left=Math.max(0,Math.round((SES.endsAt-Date.now())/1e3));
    const el=$('tleft');
    if(el){el.textContent=mmss(left);$('tbar').style.width=(100*left/SES.total)+'%'}
    if(left<=0)finish('time');
  },250);
}
function release(id){const w=W.find(x=>x.id===id);if(w){w.status='resolved';w.resolution='released';save()}SES.stats.rel++;advance()}
function keep(){SES.stats.keep++;advance()}
function advance(){if(!SES)return;SES.idx++;if(SES.idx>=SES.queue.length)finish('done');else render()}
function finish(reason){if(!SES)return;SES.running=false;SES.done={rel:SES.stats.rel,work:SES.stats.work,keep:SES.stats.keep,total:SES.queue.length,reason,swap:pick(SWAPS)};clearInterval(TICK);render()}

// ---------- progress ----------
function viewStats(){
  const total=W.length,resolved=W.filter(w=>w.status==='resolved').length,released=W.filter(w=>w.status==='resolved'&&w.resolution==='released').length,parked=W.filter(w=>w.status==='parked').length;
  const acts=W.filter(w=>w.action&&w.action.done).length;
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d)}
  const counts=days.map(d=>W.filter(w=>w.created>=d.getTime()&&w.created<d.getTime()+864e5).length);
  const max=Math.max(1,...counts);
  const lc={};W.forEach(w=>(w.labels||[]).forEach(l=>lc[l]=(lc[l]||0)+1));
  const top=Object.entries(lc).sort((a,b)=>b[1]-a[1]).slice(0,3);
  let h=`<div class="head"><div class="logo">🌤️</div><div><h1>Progress</h1><div class="sub">a record, never a scorecard</div></div>${headExtras()}</div>`;
  h+=`<div class="card"><b>Your path: ${doneCount()} of 7 skills practiced</b><div class="pbar"><i style="width:${Math.round(doneCount()/7*100)}%"></i></div><div class="lbls" style="margin-top:10px">${[1,2,3,4,5,6,7].map(n=>`<span class="chip st lb">${doneFlag(n)?'✅':'⬜'} ${SKMETA[n-1][0]} ${SKMETA[n-1][1]}</span>`).join('')}</div></div>`;
  h+=`<div class="stat"><div><b>${total}</b><span>written down</span></div><div><b>${resolved}</b><span>finished with</span></div><div><b>${parked}</b><span>waiting now</span></div></div>`;
  if(acts)h+=`<div class="swap">👣 <b>${acts} small step${acts===1?'':'s'} taken</b> — action is the skill that shrinks real problems.</div>`;
  if(released)h+=`<div class="tip">🎈 ${released} ${released===1?'worry faded':'worries faded'} on its own by the time you sat down with it. That's what worries do when you stop feeding them all day.</div>`;
  if(USE.g5||USE.br||USE.trueNow||USE.hb)h+=`<div class="card"><h3>Skill reps so far</h3><div class="lbls">${USE.g5?`<span class="chip st lb">👀 Senses game ×${USE.g5}</span>`:''}${USE.br?`<span class="chip st lb">🫁 Breathing ×${USE.br}</span>`:''}${USE.trueNow?`<span class="chip st lb">🌤️ True-right-now ×${USE.trueNow}</span>`:''}${USE.hb?`<span class="chip st lb">💗 Habit swaps ×${USE.hb}</span>`:''}</div><p class="hint">Every rep retrains the loop. That's the whole game. 💪</p></div>`;
  h+=`<div class="card"><h3>Your week at a glance</h3><div class="week">`+counts.map((c,i)=>`<div><em>${c||''}</em><i style="height:${(c/max)*100}%"></i><b>${'SMTWTFS'[days[i].getDay()]}</b></div>`).join('')+`</div></div>`;
  h+=`<div class="card"><h3>Your most common worry tricks</h3>`+(top.length?`<div class="lbls">`+top.map(([l,n])=>{const L=LABELS.find(x=>x[0]===l);return L?`<span class="chip" style="background:#4f46e5;color:#fff;border-color:#4f46e5;cursor:default">${L[1]} ${L[2]} ×${n}</span>`:''}).join('')+`</div>`:`<p style="color:var(--muted);font-size:14px">Label a few worries and your personal pattern will surface here.</p>`)+`</div>`;
  return h;
}

// ---------- welcome & auth ----------
function sheetWelcome(){
  return `<div class="ov"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">welcome 👋</div>
  <h2 style="text-align:center">Learn to train your brain out of worry — one skill at a time</h2>
  <p style="color:var(--lesson-ink);font-size:14.5px;line-height:1.6">This app is built on your handout's <b>7 skills</b>, and it teaches them <b>in order, one at a time</b>:<br><br>📖 Each skill gets a short lesson — what it is, why it works, an example.<br>🎯 Then one small practice mission on a real worry of yours.<br>✅ Finish it, and the next skill unlocks.<br><br>The Worry Window is Skill 6, near the end, kept light — exactly like your therapist asked. Start at Skill 1 and the path does the rest. There's no wrong way to use this.</p>
  ${sb?'<div class="swap">☁️ Want everything on every device? Tap <b>“Sign in to sync”</b> at the top of the Path tab anytime.</div>':''}
  <div class="row"><button class="btn primary" style="flex:1" onclick="CFG.hi=true;saveCfg();UI.welcome=false;render()">Start Skill 1 🌀</button></div>
  </div></div>`;
}
function sheetAuth(){
  if(USER)return `<div class="ov" onclick="if(event.target===this){UI.auth=false;render()}"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">☁️ your account</div>
  <div class="quote" style="text-align:center">${esc(USER.email)}<br><span style="font-size:13px;color:var(--muted)">${chipTxt()}</span></div>
  <p class="hint" style="text-align:center">Your worries and your place on the path are saved to your account and follow you to any device you sign in on.</p>
  <div class="row"><button class="btn soft" style="flex:1" onclick="UI.auth=false;render()">close</button><button class="btn ghost" onclick="sb.auth.signOut()">sign out</button></div>
  </div></div>`;
  return `<div class="ov" onclick="if(event.target===this){UI.auth=false;render()}"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">☁️ sync across devices</div>
  <h2 style="text-align:center">Sign in</h2>
  <p class="hint" style="text-align:center;margin-top:4px">Use the <b>same email and password on every device</b>, and everything follows you.</p>
  <div class="fld">Email</div><input id="aemail" type="email" autocomplete="email" placeholder="you@example.com">
  <div class="fld">Password (6+ characters)</div><input id="apass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth('in')">
  <div class="aerr" id="aerr"></div>
  <div class="row"><button class="btn primary" style="flex:1" onclick="doAuth('in')">Sign in</button><button class="btn soft" style="flex:1" onclick="doAuth('up')">Create account</button></div>
  <p class="hint" style="text-align:center">First time? “Create account” sets everything up.</p>
  <div class="row" style="justify-content:center"><button class="btn ghost" onclick="UI.auth=false;render()">not now</button></div>
  </div></div>`;
}
function authErr(m){const el=$('aerr');if(el)el.textContent=m}
async function doAuth(mode){
  if(!sb)return;
  const email=$('aemail').value.trim().toLowerCase(),pass=$('apass').value;
  if(!email||!pass){authErr('Please fill in both your email and a password.');return}
  authErr('');
  try{
    if(mode==='up'){
      const r=await sb.auth.signUp({email,password:pass});
      if(r.data&&r.data.user&&!r.session)authErr('Almost there! Check your email inbox for a confirmation link, then sign in here.');
    }else{
      const{error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
  }catch(e){authErr(e.message)}
}

if(sb)sb.auth.onAuthStateChange((ev,sess)=>{
  const was=USER;
  USER=sess?.user||null;
  if(USER&&!was)pullRemote(ev==='SIGNED_IN');
  else if(!USER&&ev==='SIGNED_OUT'){SYNC='local';UI.auth=false;toast('Signed out — your data stays safe on this device.');render()}
});

applyTheme();
render();
</script>
</body>
</html>
