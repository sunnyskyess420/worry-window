<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worry Window</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:560px;padding:16px 16px 120px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 600px at 90% -10%,#ece9ff,rgba(236,233,255,0)),radial-gradient(700px 500px at -10% 100%,#e2f5f0,rgba(226,245,240,0)),#f7f6fb;color:#312e46}
.head{display:flex;gap:12px;align-items:center;padding:14px 2px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#818cf8,#14b8a6);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 20px rgba(99,102,241,.3)}
h1{font-size:21px;margin:0}h2{margin:4px 0}h3{margin:0 0 6px}
.sub{font-size:12px;color:#8a87a0}
.card{background:#fff;border:1px solid #eceaf4;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 24px rgba(62,55,130,.06)}
.btn{border:none;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.primary{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.soft{background:#eef0ff;color:#4338ca}
.ghost{background:none;color:#8a87a0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea,input{width:100%;border:1.5px solid #e4e2f0;border-radius:12px;padding:12px;font:inherit;font-size:15px;background:#fbfaff;margin:6px 0;resize:vertical;color:#312e46}
input[type=time]{width:auto}
.chip{border:1px solid #e4e2f0;background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:#5d5a75;font-family:inherit}
.chip.on{background:#4f46e5;border-color:#4f46e5;color:#fff}
.lbls,.filters,.dur{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.breath{width:180px;height:180px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 32% 28%,#a5b4fc,#6366f1 58%,#4f46e5);color:#fff;font-size:19px;font-weight:700;line-height:1.3;box-shadow:0 18px 46px rgba(99,102,241,.38);animation:b 5.5s ease-in-out infinite;font-family:inherit}
@keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.center{text-align:center;padding:18px 0}
.hint{color:#9b98b0;font-size:13px;margin-top:14px}
.wcard{cursor:pointer}.wcard:active{transform:scale(.985)}
.wtxt{font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.chip.st{cursor:default}
.st.active{background:#fff4e0;border-color:#f5e3c0;color:#b45309}
.st.parked{background:#eef0ff;border-color:#dbe0ff;color:#4338ca}
.st.resolved{background:#e8f8f2;border-color:#c6ecdc;color:#047857}
.st.lb{background:#f7f6fb;color:#5d5a75}
.tm{margin-left:auto;color:#b0adbf;font-size:11.5px}
.empty{text-align:center;color:#8a87a0;font-size:14px}
.tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid #eceaf4;border-radius:20px;padding:6px;box-shadow:0 14px 40px rgba(62,55,130,.18);z-index:40}
.tab{border:none;background:none;border-radius:14px;padding:8px 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;color:#8a87a0;font-family:inherit}
.tab.on{background:#4f46e5;color:#fff}
.tab span{font-size:17px;position:relative}.tab b{font-size:10px;font-weight:700}
.bdg{position:absolute;top:-5px;right:-9px;background:#f59e0b;color:#fff;font-size:9px;font-style:normal;font-weight:700;border-radius:99px;padding:1px 5px}
.ov{position:fixed;inset:0;background:rgba(35,32,52,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 20px 30px;max-height:88vh;overflow:auto}
.handle{width:42px;height:5px;border-radius:99px;background:#e4e2f0;margin:6px auto 10px}
.eyebrow{text-align:center;color:#9b98b0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:2px 0 8px}
.quote{background:#f7f6fb;border-left:4px solid #a5b4fc;border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.5;margin:6px 0 10px}
.fld{font-size:12.5px;color:#9b98b0;margin:10px 0 0;font-weight:700}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#312e46;color:#fff;border-radius:13px;padding:11px 16px;font-size:13.5px;z-index:99;box-shadow:0 12px 30px rgba(35,32,52,.35);max-width:90vw}
.bar{height:10px;background:#e9e7f5;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#818cf8,#14b8a6);border-radius:99px;transition:width .3s}
.timer{font-size:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat div{background:#f7f6fb;border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:#8a87a0}
.week{display:flex;gap:8px;align-items:flex-end;height:100px;margin-top:10px}
.week>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.week i{width:100%;max-width:34px;background:linear-gradient(180deg,#818cf8,#6366f1);border-radius:7px;min-height:3px}
.week b,.week em{font-size:10.5px;color:#8a87a0;font-style:normal;font-weight:700}
ol.steps{padding-left:24px;line-height:1.55;font-size:14px}ol.steps li{margin:10px 0}
.tip{background:#fff7e6;border:1px solid #f5e3c0;color:#92400e;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin:10px 0}
.swap{background:#ecfdf5;border:1px solid #c6ecdc;color:#065f46;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const pick=a=>a[Math.floor(Math.random()*a.length)];

const LABELS=[
['whatif','🌀','What if…?'],
['cat','🔥','Worst-case'],
['mind','💭','Mind-reading'],
['always','♾️','All-or-nothing'],
['self','🏷️','Self-blame'],
['future','🔮','Fortune-telling']];
const SWAPS=[['🚶','a 5-minute walk'],['🫁','4-7-8 breathing, three rounds'],['🎵','one favorite song, really listened to'],['💧','a glass of water, slowly'],['🧩','two minutes of a puzzle game'],['📞','text someone about anything else'],['🌱','water a plant']];

let W;try{W=JSON.parse(localStorage.getItem('worrywindow')||'[]')}catch(e){W=[]}
let CFG={tab:'log',filter:'all',dur:15,time:'17:30',hi:false};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('wwcfg')||'{}'))}catch(e){}
const save=()=>localStorage.setItem('worrywindow',JSON.stringify(W));
const saveCfg=()=>localStorage.setItem('wwcfg',JSON.stringify(CFG));
let UI={capture:false,modal:null,challenge:null,welcome:!CFG.hi};
let SES=null,TICK=null;

function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}
function stBadge(w){return w.status==='parked'?'⏰ waiting':w.status==='resolved'?(w.resolution==='released'?'🎈 let go':w.resolution==='challenged'?'⚖️ talked back':'✅ done'):'🫧 fresh'}

function render(){
  const parked=W.filter(w=>w.status==='parked').length;
  let h='';
  if(CFG.tab==='log')h=viewLog();
  else if(CFG.tab==='window')h=viewWindow();
  else if(CFG.tab==='stats')h=viewStats();
  else h=viewMethod();
  h+='<nav class="tabs">'+[['log','🫧','Worries'],['window','⏰','Time'],['stats','🌤️','Progress'],['method','📖','Guide']].map(t=>
    `<button class="tab ${CFG.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[2]}${t[0]==='window'&&parked?`<i class="bdg">${parked}</i>`:''}</span><b>${t[1]}</b></button>`).join('')+'</nav>';
  if(UI.welcome)h+=sheetWelcome();
  if(UI.modal)h+=sheetWorry();
  if(UI.challenge)h+=sheetChallenge();
  $('app').innerHTML=h;
}
function go(t){CFG.tab=t;saveCfg();render()}

function sheetWelcome(){
  return `<div class="ov"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">welcome 👋</div>
  <h2 style="text-align:center">Your worries, on <i>your</i> schedule</h2>
  <p style="color:#514d68;font-size:14.5px;line-height:1.6">Here's the whole idea:<br><br>🫧 <b>When a worry pops up</b>, don't wrestle it. Write it down in a sentence or two.<br><br>⏰ <b>Save it for your daily Worry Time.</b> Once your brain knows the worry will get its turn, it can let go for now.<br><br>🌤️ <b>Once a day</b>, open the window, face the list, close it. Most worries feel much smaller in daylight.<br><br>Nobody sees this but you. There's no wrong way to use it.</p>
  <div class="row"><button class="btn primary" style="flex:1" onclick="CFG.hi=true;saveCfg();UI.welcome=false;render()">Let's go 🫧</button><button class="btn soft" style="flex:1" onclick="CFG.hi=true;saveCfg();UI.welcome=false;CFG.tab='method';saveCfg();render()">📖 Show me the guide first</button></div>
  </div></div>`;
}

function viewLog(){
  let h=`<div class="head"><div class="logo">🪟</div><div><h1>Worry Window</h1><div class="sub">write it down · meet it once a day · move on</div></div></div>`;
  if(!W.length)h+=`<div class="tip"><b>New here? This is all you need to know:</b><br>1️⃣ When a worry won't stop spinning, tap the big button and write it down.<br>2️⃣ Tap "⏰ Save for Worry Time" — you'll face it later, on purpose.<br>3️⃣ Once a day, open your Worry Time, go through the list, then close it. Worries feel smaller in daylight. Really.</div>`;
  if(UI.capture){
    h+=`<div class="card"><textarea id="wtext" rows="3" autofocus placeholder="What's the worry? Your own words are perfect. e.g., What if I embarrass myself tomorrow?"></textarea>
    <div class="hint">Nobody sees this but you. Messy is fine — this is just for getting it out of your head.</div>
    <div class="fld">🏷️ Does it have one of these names? (optional)</div>
    <div class="lbls">`+LABELS.map(l=>`<button class="chip" data-l="${l[0]}" onclick="this.classList.toggle('on')">${l[1]} ${l[2]}</button>`).join('')+`</div>
    <div class="hint">Naming the trick reminds your brain: it's a habit, not the truth.</div>
    <div class="row"><button class="btn primary" onclick="saveWorry(1)">⏰ Save for Worry Time</button><button class="btn soft" onclick="saveWorry(0)">🫧 Just write it down</button><button class="btn ghost" onclick="UI.capture=false;render()">cancel</button></div></div>`;
  }else{
    h+=`<div class="center"><button class="breath" onclick="UI.capture=true;render()">Catch a<br>worry</button><div class="hint">tap the moment a worry starts going round and round — don't fix it, just write it down</div></div>`;
  }
  const f=CFG.filter;
  const cnt=s=>s==='all'?W.length:s==='open'?W.filter(w=>w.status!=='resolved').length:W.filter(w=>w.status===s).length;
  h+='<div class="filters">'+[['all','All'],['open','Still open'],['parked','⏰ Waiting'],['resolved','✅ Done']].map(x=>
    `<button class="chip ${f===x[0]?'on':''}" onclick="CFG.filter='${x[0]}';saveCfg();render()">${x[1]}${cnt(x[0])?' '+cnt(x[0]):''}</button>`).join('')+'</div>';
  const list=W.filter(w=>f==='all'||(f==='open'?w.status!=='resolved':w.status===f));
  if(!list.length)h+=`<div class="card empty">${W.length?'Nothing in this pile right now ✓':'Nothing here yet — that big button above is the whole practice.'}</div>`;
  list.forEach(w=>{
    h+=`<div class="card wcard" onclick="UI.modal='${w.id}';render()"><div class="wtxt">${esc(w.text)}</div><div class="wmeta"><span class="chip st ${w.status}">${stBadge(w)}</span>${(w.labels||[]).slice(0,3).map(l=>{const L=LABELS.find(x=>x[0]===l);return L?`<span class="chip st lb">${L[1]} ${L[2]}</span>`:''}).join('')}<span class="tm">${ago(w.created)}</span></div></div>`;
  });
  return h;
}

function saveWorry(park){
  const t=$('wtext')?$('wtext').value.trim():'';
  if(!t){toast('Type even one line first — it helps, promise');return}
  const labels=[...document.querySelectorAll('.lbls .chip.on')].map(c=>c.dataset.l);
  W.unshift({id:uid(),text:t,labels:labels,status:park?'parked':'active',resolution:null,created:Date.now()});
  save();UI.capture=false;render();
  if(park){const s=pick(SWAPS);toast('Saved for Worry Time ⏰ Meanwhile, try: '+s[0]+' '+s[1])}
  else toast('Out of your head and onto the page ✓ That alone helps.');
}

function sheetWorry(){
  const w=W.find(x=>x.id===UI.modal);if(!w)return'';
  const labels=w.labels||[];
  return `<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">a thought, not a fact</div>
  <div class="quote">${esc(w.text)}</div>
  <div class="fld">🏷️ Name the trick (optional)</div>
  <div class="lbls">`+LABELS.map(l=>`<button class="chip ${labels.includes(l[0])?'on':''}" onclick="tglLbl('${w.id}','${l[0]}')">${l[1]} ${l[2]}</button>`).join('')+`</div>
  <div class="row"><button class="btn soft" onclick="park('${w.id}')">${w.status==='parked'?'↩️ Not waiting anymore':'⏰ Save for Worry Time'}</button><button class="btn primary" onclick="UI.challenge='${w.id}';UI.modal=null;render()">⚖️ Talk back to it</button></div>
  ${w.status!=='resolved'?`<div class="row"><button class="btn ghost" onclick="resolve('${w.id}','manual')">✅ I feel okay about this one now</button></div>`:''}
  ${w.ch?`<div class="swap"><b>🌤️ What I figured out:</b> ${esc(w.ch.is||'—')}<br>${w.ch.next?'<b>👣 My next step:</b> '+esc(w.ch.next):''}</div>`:''}
  <div class="row" style="justify-content:center"><button class="btn ghost" onclick="del('${w.id}')">🗑️ delete this worry</button></div>
  </div></div>`;
}
function tglLbl(id,l){const w=W.find(x=>x.id===id);if(!w)return;w.labels=w.labels||[];w.labels=w.labels.includes(l)?w.labels.filter(x=>x!==l):[...w.labels,l];save();render()}
function park(id){const w=W.find(x=>x.id===id);if(!w)return;w.status=w.status==='parked'?'active':'parked';save();render()}
function resolve(id,r){const w=W.find(x=>x.id===id);if(!w)return;w.status='resolved';w.resolution=r;save();render();toast("Marked done ✓ Nice work.")}
function del(id){W=W.filter(x=>x.id!==id);save();closeSheet()}
function closeSheet(){UI.modal=null;UI.challenge=null;render()}

function sheetChallenge(){
  const w=W.find(x=>x.id===UI.challenge);if(!w)return'';
  const c=w.ch||{for:'',against:'',is:'',next:''};
  return `<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet">
  <div class="handle"></div><div class="eyebrow">⚖️ a little fact-check</div>
  <div class="quote">${esc(w.text)}</div>
  <div class="tip">Worries hate specific questions. Answer like a detective — short and factual is perfect.</div>
  <div class="fld">🧐 What makes this worry feel true? (facts only)</div><textarea id="cf" rows="2" placeholder="e.g., I haven't finished preparing yet">${esc(c.for)}</textarea>
  <div class="fld">🌤️ What says it might actually be fine?</div><textarea id="ca" rows="2" placeholder="e.g., I've done this before and it went okay">${esc(c.against)}</textarea>
  <div class="fld">🌈 The fairer version — say it like you'd comfort a friend</div><textarea id="ci" rows="2" placeholder="e.g., It might be awkward, and I can handle awkward">${esc(c.is)}</textarea>
  <div class="fld">👣 One small step I can take today (5 minutes max)</div><input id="cn" value="${esc(c.next)}" placeholder="e.g., send one email · ask one question · look it up once">
  <div class="row"><button class="btn primary" onclick="saveCh('${w.id}')">Save what I figured out ✓</button><button class="btn ghost" onclick="closeSheet()">close</button></div>
  </div></div>`;
}
function saveCh(id){
  const w=W.find(x=>x.id===id);if(!w)return;
  w.ch={for:$('cf').value.trim(),against:$('ca').value.trim(),is:$('ci').value.trim(),next:$('cn').value.trim()};
  const wasWin=SES&&SES.running;
  w.status='resolved';w.resolution='challenged';save();
  UI.challenge=null;UI.modal=null;
  if(wasWin){SES.stats.work++;advance()}
  render();toast("Saved ✓ That worry just got smaller.");
}

function viewWindow(){
  const parked=W.filter(w=>w.status==='parked');
  if(SES&&SES.done){
    const d=SES.done;
    return `<div class="card"><div style="text-align:center;font-size:44px">🌙</div><h2 style="text-align:center;margin:4px 0">Worry Time is over</h2>
    <p class="center" style="color:#514d68">${d.reason==='time'?"Time's up — and that's the whole point. The window closed, and the worries stay in it.":d.reason==='done'?'You met every single worry on the list. That is a genuinely good day.':'You closed it early — totally allowed. You are the one in charge here.'}</p>
    <div class="stat"><div><b>${d.rel}</b><span>🎈 let go</span></div><div><b>${d.work}</b><span>⚖️ talked back</span></div><div><b>${d.keep}</b><span>⏳ next time</span></div></div>
    ${d.keep?'<p style="text-align:center;color:#8a87a0;font-size:13.5px">The rest wait for tomorrow\'s window. Choosing to wait on purpose <i>is</i> the method working — not failing.</p>':''}
    <div class="swap"><b>Still feel the pull to keep worrying? Do this instead:</b><br>${d.swap[0]} ${d.swap[1]}</div>
    <button class="btn primary" style="width:100%" onclick="SES=null;render()">Done — back to my day 🌤️</button></div>`;
  }
  if(SES&&SES.running){
    const w=SES.queue[SES.idx];
    return `<div class="card"><div class="timer" id="tleft">${mmss(Math.max(0,Math.round((SES.endsAt-Date.now())/1e3)))}</div>
    <div class="bar"><i id="tbar" style="width:100%"></i></div>
    <p class="center" style="color:#8a87a0;font-size:13px">Worry ${SES.idx+1} of ${SES.queue.length} · one at a time, that's all</p>
    ${w?`<div class="quote">${esc(w.text)}</div>
    <p class="center" style="color:#9b98b0;font-size:12.5px">Look it in the eye for a moment. Does it still deserve the space?</p>
    <div class="row"><button class="btn green" onclick="release('${w.id}')">🎈 It feels lighter — let it go</button><button class="btn primary" onclick="UI.challenge='${w.id}';render()">⚖️ Still heavy — talk back to it</button></div>
    <div class="row"><button class="btn ghost" onclick="keep()">⏭ Not today — keep it for next time</button></div>`:''}
    <div class="row" style="justify-content:center"><button class="btn ghost" onclick="finish('early')">close Worry Time early</button></div></div>`;
  }
  return `<div class="card"><h2>Your daily Worry Time ⏰</h2>
  <p style="color:#514d68;font-size:14.5px;line-height:1.55">You don't have to wrestle worries the moment they appear. Write them down during the day, then meet them all here — one appointment, one window. Most arrive already smaller. That's not luck; that's what worries do when you stop feeding them all day.</p>
  <div class="fld">⏰ What time should your Worry Time be?</div><input type="time" value="${CFG.time}" onchange="CFG.time=this.value;saveCfg()">
  <div class="fld">⏳ How long should it last?</div><div class="dur">${[5,10,15,20,30].map(d=>`<button class="chip ${CFG.dur===d?'on':''}" onclick="CFG.dur=${d};saveCfg();render()">${d}m</button>`).join('')}</div>
  <div class="tip">💡 Tip: set a daily phone alarm for this time. After a week or two, the habit runs itself.</div>
  <button class="btn primary" style="width:100%" onclick="startWin()">${parked.length?'Open my Worry Time · '+parked.length+' waiting':'Open my Worry Time'}</button>
  ${parked.length?'':'<p class="center" style="color:#8a87a0;font-size:13px;margin-top:10px">Nothing waiting right now. When a worry shows up today, tap the big button on the Worries tab and save it here.</p>'}</div>`;
}

function startWin(){
  const parked=W.filter(w=>w.status==='parked');
  if(!parked.length){toast("Nothing waiting yet — save worries during the day and they'll be here.");return}
  SES={queue:parked.slice(),idx:0,total:CFG.dur*60,endsAt:Date.now()+CFG.dur*60000,stats:{rel:0,work:0,keep:0},running:true,done:null};
  render();startTick();
}
function startTick(){
  clearInterval(TICK);
  TICK=setInterval(()=>{
    if(!SES||!SES.running)return clearInterval(TICK);
    const left=Math.max(0,Math.round((SES.endsAt-Date.now())/1e3));
    const el=$('tleft');
    if(el){el.textContent=mmss(left);$('tbar').style.width=(100*left/SES.total)+'%'}
    if(left<=0)finish('time');
  },250);
}
function release(id){const w=W.find(x=>x.id===id);if(w){w.status='resolved';w.resolution='released';save()}SES.stats.rel++;advance()}
function keep(){SES.stats.keep++;advance()}
function advance(){if(!SES)return;SES.idx++;if(SES.idx>=SES.queue.length)finish('done');else render()}
function finish(reason){if(!SES)return;SES.running=false;SES.done={rel:SES.stats.rel,work:SES.stats.work,keep:SES.stats.keep,total:SES.queue.length,reason,swap:pick(SWAPS)};clearInterval(TICK);render()}

function viewStats(){
  const total=W.length,resolved=W.filter(w=>w.status==='resolved').length,released=W.filter(w=>w.status==='resolved'&&w.resolution==='released').length,parked=W.filter(w=>w.status==='parked').length;
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d)}
  const counts=days.map(d=>W.filter(w=>w.created>=d.getTime()&&w.created<d.getTime()+864e5).length);
  const max=Math.max(1,...counts);
  const lc={};W.forEach(w=>(w.labels||[]).forEach(l=>lc[l]=(lc[l]||0)+1));
  const top=Object.entries(lc).sort((a,b)=>b[1]-a[1]).slice(0,3);
  let h=`<div class="stat"><div><b>${total}</b><span>written down</span></div><div><b>${resolved}</b><span>finished with</span></div><div><b>${parked}</b><span>waiting now</span></div></div>`;
  if(released)h+=`<div class="tip">🎈 ${released} ${released===1?'worry faded':'worries faded'} on their own by the time you sat down with them. That's what worries do when you stop feeding them all day.</div>`;
  h+=`<div class="card"><h3>Your week at a glance</h3><div class="week">`+counts.map((c,i)=>`<div><em>${c||''}</em><i style="height:${(c/max)*100}%"></i><b>${'SMTWTFS'[days[i].getDay()]}</b></div>`).join('')+`</div><p class="hint" style="text-align:center">Just a record — never a scorecard. 🌤️</p></div>`;
  h+=`<div class="card"><h3>Your most common worry tricks</h3>`+(top.length?`<div class="lbls">`+top.map(([l,n])=>{const L=LABELS.find(x=>x[0]===l);return L?`<span class="chip" style="background:#4f46e5;color:#fff;border-color:#4f46e5;cursor:default">${L[1]} ${L[2]} ×${n}</span>`:''}).join('')+`</div>`:`<p style="color:#8a87a0;font-size:14px">Open any worry and give it a nickname — after a few, your personal pattern shows up here.</p>`)+`<p style="color:#9b98b0;font-size:12.5px;margin-top:8px">Spotting the pattern is halfway to breaking it. 💪</p></div>`;
  return h;
}

function viewMethod(){
  return `<div class="card"><h2>How it works — the friendly version</h2><ol class="steps">
  <li><b>🫧 Notice the spin.</b> The moment you catch the same thought going round and round, open this app and type it out. Even one sentence. Getting it out of your head makes it quieter right away.</li>
  <li><b>🏷️ Give the trick a nickname.</b> Is it a "what if…?" spiral? A worst-case movie? Guessing what other people think? Naming it reminds you: this is a brain habit, not the truth about your life.</li>
  <li><b>⏰ Give it an appointment.</b> Tap "Save for Worry Time." You're not ignoring the worry — you're promising it a proper meeting later. Brains calm down once they know their turn is coming.</li>
  <li><b>⚖️ At Worry Time, question it.</b> Ask: What are the facts here? What would I say to a friend who told me this? Worries sound very convincing at 2 a.m. — and far less scary in daylight.</li>
  <li><b>🌤️ Write the fairer version.</b> Swap "what if it all goes wrong?" for what's actually true. Example: "The meeting might be awkward, and I've survived awkward before."</li>
  <li><b>👣 Take one tiny step.</b> Worries shrink with action. Send the email, ask the question, look it up once — five minutes, then stop.</li>
  <li><b>🔁 Close the window.</b> When time's up, you're done — on purpose. If your brain tries to sneak back in, give it a swap: walk, song, water, stretch. It gets easier every time. Promise.</li>
  </ol></div>`;
}

render();
</script>
